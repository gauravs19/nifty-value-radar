name: Daily Stock Screen

on:
  schedule:
    # 01:30 UTC = 7:00am IST, weekdays -- previous close's data is fully
    # settled overnight, and this lands well before the 9:15am IST open
    # so the report is something to act on, not something to review after.
    - cron: "30 1 * * 1-5"
  workflow_dispatch: {}

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python main.py

      - name: Upload signals CSV
        uses: actions/upload-artifact@v4
        with:
          name: latest-signals
          path: data/latest_signals.csv
          retention-days: 90

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: latest-report-html
          path: data/latest_report.html
          retention-days: 90

